name: Build HACKER PROTOCOL Cyber World APK

on:
  push:
    branches: [main, master]
    paths:
      - "cyber-world/**"
      - ".github/workflows/build-cyber-world.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cyber-world-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-apk:
    name: Export Android APK
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # GitHub-hosted Ubuntu images already include Android command-line tools.
      # Avoid a second SDK bootstrap action, which was the failing step in run #14.
      - name: Locate preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_ROOT" ]; then
            echo "Android SDK directory not found: $SDK_ROOT"
            exit 1
          fi
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found under $SDK_ROOT/cmdline-tools"
            find "$SDK_ROOT" -maxdepth 4 -type f -name sdkmanager -print || true
            exit 1
          fi
          CMDLINE_TOOLS="$(dirname "$SDKMANAGER")"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$CMDLINE_TOOLS" >> "$GITHUB_PATH"
          echo "Using Android SDK: $SDK_ROOT"
          "$SDKMANAGER" --version

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          ADB="$ANDROID_HOME/platform-tools/adb"
          if [ ! -x "$ADB" ]; then
            echo "Android platform-tools installation did not provide adb: $ADB"
            find "$ANDROID_HOME" -maxdepth 4 -type f -name adb -print || true
            exit 1
          fi
          "$ADB" version
          "$ADB" start-server

      - name: Install matching Godot export templates
        shell: bash
        run: |
          set -euo pipefail
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.4.1.stable"
          mkdir -p "$TEMPLATE_DIR"
          curl --retry 3 --retry-delay 2 -L --fail             https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz             -o /tmp/godot-templates.tpz
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates
          cp /tmp/godot-templates/templates/* "$TEMPLATE_DIR/"

      - name: Create Android debug keystore and configure Godot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android" "$HOME/.config/godot"
          if [ ! -s "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          test -d "$ANDROID_HOME/platform-tools"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Validate project import and script parsing
        shell: bash
        run: |
          set -euo pipefail
          godot --version
          set +e
          godot --headless --editor --path cyber-world --quit 2>&1 | tee /tmp/godot-import.log
          GODOT_EXIT=${PIPESTATUS[0]}
          set -e
          if [ "$GODOT_EXIT" -ne 0 ]; then
            exit "$GODOT_EXIT"
          fi
          if grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script" /tmp/godot-import.log; then
            echo "Godot reported script parse/load errors."
            exit 1
          fi

      - name: Export debug APK
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="$GITHUB_WORKSPACE/build/HackerProtocol-CyberWorld-debug.apk"
          mkdir -p "$(dirname "$APK_PATH")"
          test -d "$(dirname "$APK_PATH")"
          set +e
          godot --headless --verbose --path cyber-world --export-debug "Android" "$APK_PATH" 2>&1 | tee /tmp/godot-export.log
          GODOT_EXIT=${PIPESTATUS[0]}
          set -e
          if [ "$GODOT_EXIT" -ne 0 ]; then
            echo "Godot Android export failed. Relevant diagnostics:"
            grep -Ei "error|failed|missing|not found|invalid|keystore|sdk|template" /tmp/godot-export.log | tail -n 100 || true
            exit "$GODOT_EXIT"
          fi
          if [ ! -s "$APK_PATH" ]; then
            echo "Godot returned success but the APK is missing or empty: $APK_PATH"
            exit 1
          fi
          file "$APK_PATH"
          ls -lh "$APK_PATH"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HackerProtocol-CyberWorld-debug-apk
          path: ${{ github.workspace }}/build/HackerProtocol-CyberWorld-debug.apk
          if-no-files-found: error
          retention-days: 14
